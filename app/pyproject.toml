# Project metadata and tool settings for sample-api.
# Dependencies are pinned in requirements.txt / requirements-dev.txt (installed by the Dockerfile).
[project]
name = "sample-api"
version = "0.1.0"
description = "Small FastAPI service used to demo the kubernetes-platform-starter platform."
license = "MIT"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sample_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
