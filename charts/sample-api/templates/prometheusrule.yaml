{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "sample-api.fullname" . }}
  labels:
    {{- include "sample-api.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# The rules live in a plain Prometheus rule file, so promtool can unit-test them
# (monitoring/tests/sample-api.test.yaml). .Files.Get inserts them as-is (not templated).
spec:
  {{- .Files.Get "rules/sample-api.rules.yaml" | trim | nindent 2 }}
{{- end }}
