# Checks for the Helm chart, the Argo CD manifests, the alert rules and the shell scripts.
# All tool versions come from versions.env, the same file the Makefile reads, and the
# checks are the same scripts/lint.sh commands that "make lint" runs on a laptop
# (plus chart-testing, which only runs here).
name: helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "gitops/**"
      - "monitoring/**"
      - "scripts/**"
      - "kind/**"
      - "docs/runbooks/**"
      - "versions.env"
      - ".github/ct.yaml"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "charts/**"
      - "gitops/**"
      - "monitoring/**"
      - "scripts/**"
      - "kind/**"
      - "docs/runbooks/**"
      - "versions.env"
      - ".github/ct.yaml"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # Python tools used by chart-testing (ct lint).
  YAMLLINT_VERSION: "1.38.0"
  YAMALE_VERSION: "6.1.0"

jobs:
  chart:
    name: Helm lint, kubeconform, chart-testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # chart-testing compares against the target branch
          persist-credentials: false

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Same commands as "make lint-helm" and "make lint-k8s".
      - name: helm lint (base values and each environment)
        run: scripts/lint.sh helm

      - name: kubeconform (rendered chart, Argo CD manifests, kind node image check)
        run: scripts/lint.sh k8s

      - name: Set up Python (for chart-testing)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Not helm/chart-testing-action: its installer (v2.8.0) verifies ct with .pem/.sig files,
      # and ct v3.15.0 publishes Sigstore bundles instead, so the action cannot install it.
      # We download the pinned release and check it against the release's checksums.txt.
      - name: Install chart-testing
        run: |
          ver="${CHART_TESTING_VERSION#v}"
          tarball="chart-testing_${ver}_linux_amd64.tar.gz"
          base="https://github.com/helm/chart-testing/releases/download/${CHART_TESTING_VERSION}"
          mkdir -p "$RUNNER_TEMP/ct"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "${tarball}" -C "$RUNNER_TEMP/ct"
          echo "$RUNNER_TEMP/ct" >> "$GITHUB_PATH"
          # ct reads lintconf.yaml and chart_schema.yaml from here.
          echo "CT_CONFIG_DIR=$RUNNER_TEMP/ct/etc" >> "$GITHUB_ENV"
          python -m pip install "yamllint==${YAMLLINT_VERSION}" "yamale==${YAMALE_VERSION}"

      - name: ct lint
        # --all: there is one chart, so always lint it (also on pushes to main).
        run: ct lint --config .github/ct.yaml --all

  rules:
    name: Alert rules (promtool)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      - name: Install promtool
        run: |
          ver="${PROMETHEUS_VERSION#v}"
          tarball="prometheus-${ver}.linux-amd64.tar.gz"
          base="https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}"
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSLO "${base}/sha256sums.txt"
          grep " ${tarball}\$" sha256sums.txt | sha256sum -c -
          tar -xzf "${tarball}" --strip-components=1 -C "$RUNNER_TEMP/bin" "prometheus-${ver}.linux-amd64/promtool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Same command as "make lint-rules": promtool check, the alert unit tests, and a check
      # that every alert has a runbook in docs/runbooks/.
      - name: Check rules, unit-test the alerts, check runbooks
        run: scripts/lint.sh rules

  scripts:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load pinned versions
        run: grep -E '^[A-Z0-9_]+=' versions.env >> "$GITHUB_ENV"

      # The runner has a shellcheck too, but its version changes with the runner image.
      # shellcheck publishes no checksum file, so the expected sha256 is pinned in versions.env.
      - name: Install shellcheck
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  ${tarball}" | sha256sum -c -
          tar -xJf "${tarball}"
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/bin/"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Same command as "make lint-sh": shellcheck scripts/*.sh, plus a check that scripts
      # call kubectl and helm only through the context-guarded wrappers in scripts/lib.sh.
      - name: shellcheck and kubectl/helm wrapper check
        run: |
          shellcheck --version
          scripts/lint.sh sh
